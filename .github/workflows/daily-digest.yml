name: Generate Daily Digest

on:
  schedule:
    # arXiv announces new submissions ~20:00 US Eastern Sun-Thu, which is 00:00 UTC
    # (EDT) or 01:00 UTC (EST) — 06:00 UTC gives a comfortable buffer after either,
    # so the fetch never races the listing update. Sun/Mon/Tue/Wed/Thu evening
    # announcements land in Monday-Friday's 06:00 UTC runs respectively, so those
    # are the only days with anything new; a Sat or Sun run would just re-fetch
    # Friday's listing again (no announcement happens Fri/Sat evening) and send a
    # duplicate notification, so weekends are skipped here entirely.
    - cron: "0 6 * * 1-5"
  workflow_dispatch: # Allow manual trigger

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generate-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Python dependencies
        working-directory: ./backend
        run: |
          uv sync

      - name: Create config.yaml from GitHub variable
        working-directory: ./backend
        run: |
          echo "${{ vars.CONFIG_YAML }}" > config.yaml

      - name: Generate digest
        working-directory: ./backend
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          uv run main.py

      - name: Download history artifact from previous run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Find latest successful run
          RUN_ID=$(gh api repos/${{ github.repository }}/actions/workflows/daily-digest.yml/runs \
            --jq '.workflow_runs[] | select(.conclusion=="success") | .id' \
            | head -n 1)

          if [ -z "$RUN_ID" ]; then
            echo "No previous successful runs found. Skipping history download."
            exit 0
          fi

          echo "Found previous run: $RUN_ID"

          # Find artifact ID
          ARTIFACT_ID=$(gh api repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts \
            --jq '.artifacts[] | select(.name=="digest-history") | .id')

          if [ -z "$ARTIFACT_ID" ]; then
            echo "No 'digest-history' artifact found in run $RUN_ID. Skipping."
            exit 0
          fi

          echo "Found artifact ID: $ARTIFACT_ID"

          # Download artifact
          gh api \
            -H "Accept: application/vnd.github+json" \
            repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip \
            > digest-history.zip

          # Unzip
          unzip digest-history.zip -d digest-history
          rm digest-history.zip

      - name: Archive digest and update history
        run: |
          python3 scripts/archive_digest.py

      - name: Upload history artifact
        uses: actions/upload-artifact@v4
        with:
          name: digest-history
          path: digest-history
          retention-days: 90

      - name: Upload digest.json as artifact
        uses: actions/upload-artifact@v4
        with:
          name: digest-json
          path: frontend/public/digest.json
          retention-days: 1

      - name: Upload authors.json as artifact
        uses: actions/upload-artifact@v4
        with:
          name: authors-json
          path: frontend/public/authors.json
          retention-days: 1

  build-and-deploy:
    needs: generate-digest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download history artifact
        uses: actions/download-artifact@v4
        with:
          name: digest-history
          path: frontend/public/
        continue-on-error: true

      # Without this file the site just hides the Subscribed tab.
      - name: Download authors.json artifact
        uses: actions/download-artifact@v4
        with:
          name: authors-json
          path: frontend/public/
        continue-on-error: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        env:
          BASE_URL: ${{ vars.BASE_URL || format('/{0}/', github.event.repository.name) }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./frontend/dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Download digest.json artifact
        uses: actions/download-artifact@v4
        with:
          name: digest-json
          path: digest-data/

      - name: Send notification
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SITE_URL: ${{ format('https://{0}.github.io{1}', github.event.repository.owner.login, vars.BASE_URL || format('/{0}/', github.event.repository.name)) }}
        run: python3 scripts/notify.py digest-data/digest.json
